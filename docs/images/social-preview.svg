<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <!-- Solid #09090B Background -->
  <rect width="1280" height="640" fill="#09090B"/>

  <!-- Logo Mark centered-left at 160px -->
  <image href="logo.png" x="120" y="240" width="160" height="160" preserveAspectRatio="xMidYMid meet"/>

  <!-- Wordmark: AIRVEE in plain sans-serif at 96px, white, letter-spacing 0.3em -->
  <text x="320" y="325" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="96" font-weight="700" letter-spacing="0.3em">AIRVEE</text>

  <!-- One orange (#FF5A1F) accent only, a small dot -->
  <circle cx="1005" cy="318" r="8" fill="#FF5A1F"/>

  <!-- Subtitle: in #A1A1AA at 32px -->
  <text x="325" y="385" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="400" letter-spacing="0.02em">Know where to look when a plane passes overhead.</text>
</svg>
